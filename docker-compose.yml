name: prestige-ops

# ---------------------------------------------------------------------------
# Prestige Accessories ops stack
#
# One EC2 box hosts:
#   - postgres   shared DB server (two databases: strapi, postiz)
#   - redis      queue backend for postiz
#   - strapi     Tyler's dashboard (headless CMS), admin at ops.prestigeaccessories.net
#   - postiz    social publisher, admin/callbacks at social.prestigeaccessories.net
#   - bridge     webhook handler: Strapi publish -> Postiz API + Cloudflare Pages rebuild
#   - caddy      reverse proxy with auto-TLS
#
# Independent from CinderLabs infra, does NOT live on any AIRA/Shield/license box.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  strapi:
    build:
      context: ./strapi
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL: "false"
      APP_KEYS: ${STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${STRAPI_JWT_SECRET}
      URL: ${STRAPI_PUBLIC_URL}
    volumes:
      - strapi-uploads:/opt/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  elasticsearch:
    # Temporal Standard Visibility (SQL) hardcodes "max 3 Text-type search attributes
    # per namespace" and Postiz needs more. Elasticsearch as visibility backend lifts
    # that limit entirely. ES 7.17 is the version the Temporal docs reference for v7
    # compatibility; xpack security off, single node, modest heap to leave room for
    # the other services on this t3.medium.
    image: elasticsearch:7.17.27
    restart: unless-stopped
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=2gb
      - cluster.routing.allocation.disk.watermark.high=1gb
      - cluster.routing.allocation.disk.watermark.flood_stage=512mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - internal
    # No healthcheck: official elasticsearch:7.17 image does not bundle curl,
    # and we don't want temporal blocked behind a healthcheck that can't run.
    # Temporal's auto-setup will retry ES connection itself on startup.

  temporal:
    # Postiz uses Temporal for job scheduling (port 7233).
    # auto-setup provisions the temporal/temporal_visibility namespaces on first boot.
    # We use Postgres for namespace+history (the SQL store) and Elasticsearch for
    # VISIBILITY, which is what removes the 3-Text-attribute limit Postiz hits.
    image: temporalio/auto-setup:1.28
    restart: unless-stopped
    environment:
      DB: postgres12_pgx
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      # --- ES visibility wiring ---
      ENABLE_ES: "true"
      ES_SEEDS: elasticsearch
      ES_VERSION: v7
      ES_PORT: "9200"
      ES_VIS_INDEX: temporal_visibility_v1_dev
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    networks:
      - internal

  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postiz"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: ${POSTIZ_JWT_SECRET}
      MAIN_URL: ${POSTIZ_PUBLIC_URL}
      FRONTEND_URL: ${POSTIZ_PUBLIC_URL}
      NEXT_PUBLIC_BACKEND_URL: "${POSTIZ_PUBLIC_URL}/api"
      # Backend NestJS listens on :5000 inside the container (confirmed via ss -ltn).
      # This URL is used by the Next.js frontend for server-side fetches to the backend.
      BACKEND_INTERNAL_URL: "http://postiz:5000"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      # Postiz reads ONE env var for the Temporal address: TEMPORAL_ADDRESS in host:port form.
      # The TEMPORAL_URL / TEMPORAL_HOST / TEMPORAL_PORT triple we used to ship here are ignored
      # by Postiz; setting any of them does not affect connection. Removing to avoid confusion.
      # Default namespace + no TLS = nothing else to set for self-hosted Temporal on docker net.
      TEMPORAL_ADDRESS: "temporal:7233"

      # --- Social platform OAuth credentials ---
      # Exact env var NAMES confirmed by grep inside the running Postiz container:
      #   docker compose exec postiz sh -c 'grep -rEo "process\.env\.[A-Z_]+(CLIENT_ID|CLIENT_SECRET|APP_ID|APP_SECRET|API_KEY|API_SECRET)" /app/apps/backend/dist | sort -u'
      # Each platform's redirect URI is discovered from Postiz attempting an OAuth
      # handshake with client_id=undefined (the platform error page reveals the URL Postiz used).
      # Until a credential pair is supplied here, that platform's "Add Channel" button
      # in Postiz will land on the platform's error page instead of the auth screen.

      # Pinterest -- App ID 1580081, App secret gated by trial review as of 2026-06-11
      # Redirect URI: https://social.prestigeaccessories.net/integrations/social/pinterest
      PINTEREST_CLIENT_ID: ${PINTEREST_CLIENT_ID:-}
      PINTEREST_CLIENT_SECRET: ${PINTEREST_CLIENT_SECRET:-}

      # Meta -- one dev app unlocks IG Standalone + IG via FB Business + FB Page + Threads
      # IG Standalone redirect: https://social.prestigeaccessories.net/integrations/social/instagram-standalone
      # IG via FB redirect:     https://social.prestigeaccessories.net/integrations/social/instagram
      # FB Page redirect:       https://social.prestigeaccessories.net/integrations/social/facebook
      # Threads redirect:       https://social.prestigeaccessories.net/integrations/social/threads
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      THREADS_APP_ID: ${THREADS_APP_ID:-}
      THREADS_APP_SECRET: ${THREADS_APP_SECRET:-}

      # TikTok -- deferred until video workflow exists
      # Redirect URI: https://social.prestigeaccessories.net/integrations/social/tiktok
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}

      # YouTube -- deferred until video workflow exists
      # Redirect URI: https://social.prestigeaccessories.net/integrations/social/youtube
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}

      # Reddit -- designer resale subs are a real audience (r/RepLadies neighbors,
      # r/LuxuryRepLadies, r/DesignerReps). Free dev app, no review wait.
      # Redirect URI: https://social.prestigeaccessories.net/integrations/social/reddit
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
    volumes:
      - postiz-uploads:/uploads
      - postiz-config:/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    networks:
      - internal

  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      WEBHOOK_SHARED_SECRET: ${BRIDGE_WEBHOOK_SECRET}
      # Strapi, public URL for image fetches, internal URL for write-back
      STRAPI_PUBLIC_URL: ${STRAPI_PUBLIC_URL}
      STRAPI_INTERNAL_URL: "http://strapi:1337"
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      STRAPI_BRIDGE_TOKEN: ${STRAPI_BRIDGE_TOKEN}
      # Claude, fills socialCopy from product image + details
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      # Postiz (publish-time social fan-out)
      # Backend NestJS listens on :3000 inside the container. Port :5000 is a
      # different service (nginx-like router that falls through to the Next.js
      # frontend for unknown paths), so /public/v1/* on :5000 returns HTML
      # login pages instead of the API. Confirmed via node fetch tests inside
      # the postiz container: :3000 with a valid API key returns JSON, :5000
      # returns Next.js HTML. API key must be a real one generated in the
      # Postiz UI (Settings -> API), not a random hex string in .env.
      POSTIZ_API_URL: "http://postiz:3000"
      POSTIZ_API_KEY: ${POSTIZ_API_KEY}
      # Site rebuild, Cloudflare deploy hook first, GitHub marker commit as fallback
      CLOUDFLARE_DEPLOY_HOOK_URL: ${CLOUDFLARE_DEPLOY_HOOK_URL}
      GITHUB_DEPLOY_TOKEN: ${GITHUB_DEPLOY_TOKEN}
      GITHUB_DEPLOY_REPO: ${GITHUB_DEPLOY_REPO:-jeromie-design/prestige-site}
      GITHUB_DEPLOY_BRANCH: ${GITHUB_DEPLOY_BRANCH:-main}
      GITHUB_DEPLOY_MARKER_PATH: ${GITHUB_DEPLOY_MARKER_PATH:-.cloudflare/last-drop.txt}
      # ----- eBay Sell API -----
      # See docs/EBAY-INTEGRATION.md for full design + auth flow.
      # EBAY_ENV switches the bridge between api.sandbox.ebay.com (sandbox) and
      # api.ebay.com (production). All other vars come from the matching keyset.
      EBAY_ENV: ${EBAY_ENV:-sandbox}
      EBAY_APP_ID: ${EBAY_APP_ID:-}
      EBAY_CERT_ID: ${EBAY_CERT_ID:-}
      EBAY_DEV_ID: ${EBAY_DEV_ID:-}
      EBAY_USER_TOKEN: ${EBAY_USER_TOKEN:-}
      EBAY_REFRESH_TOKEN: ${EBAY_REFRESH_TOKEN:-}
      EBAY_DEFAULT_SHIPPING_POLICY_ID: ${EBAY_DEFAULT_SHIPPING_POLICY_ID:-}
      EBAY_DEFAULT_RETURN_POLICY_ID: ${EBAY_DEFAULT_RETURN_POLICY_ID:-}
      EBAY_DEFAULT_PAYMENT_POLICY_ID: ${EBAY_DEFAULT_PAYMENT_POLICY_ID:-}
      EBAY_DEFAULT_LOCATION_ZIP: ${EBAY_DEFAULT_LOCATION_ZIP:-}
      EBAY_DEFAULT_CATEGORY_ID: ${EBAY_DEFAULT_CATEGORY_ID:-2993}
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - strapi
      - postiz
    networks:
      - internal

volumes:
  postgres-data:
  redis-data:
  strapi-uploads:
  postiz-uploads:
  postiz-config:
  elasticsearch-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
